name: Set mentor code

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  set-code:
    if: ${{ !contains(github.event.head_commit.message, '[mentor-code]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set mentor code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server.ts')
          s = p.read_text()
          needle = '{ id: "code-5", code: "MLS-NGU-9921", level: "nguli", used: false, used_by: "" },'
          addition = needle + '\n  { id: "code-mentor-2026", code: "MLS-MENTOR-2026", level: "mentor", used: false, used_by: "" },'
          if 'MLS-MENTOR-2026' not in s:
              if needle not in s:
                  raise SystemExit('access code seed not found')
              s = s.replace(needle, addition, 1)
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.ts
          git commit -m 'fix: add mentor registration code [mentor-code]'
          git push
          git rm .github/workflows/set-mentor-code.yml
          git commit -m 'chore: remove one-shot mentor code workflow [mentor-code]'
          git push
